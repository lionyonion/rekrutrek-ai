services:
  - type: web
    name: rekrutrek-ai
    runtime: python
    plan: starter            # WAJIB minimal Starter — free tier RAM tidak cukup untuk TensorFlow
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CHROMA_PATH
        value: /var/data/chroma_db
      - key: MODEL_DIR
        value: /var/data/saved_models
      # URL model di Supabase Storage — isi nilainya di Render Dashboard (jangan commit)
      - key: URL_JOB_EXTRACTOR
        sync: false
      - key: URL_CAND_EXTRACTOR
        sync: false
      - key: URL_JOB_VEC
        sync: false
      - key: URL_RES_VEC
        sync: false
    disk:
      name: ai-data
      mountPath: /var/data       # model + chroma_db disimpan di sini (download sekali)
      sizeGB: 1
