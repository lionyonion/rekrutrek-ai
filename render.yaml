services:
  - type: web
    name: rekrutrek-ai
    runtime: python
    plan: free               # free tier (512MB RAM) — tanpa persistent disk
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Tanpa disk: model & chroma disimpan di filesystem lokal (ephemeral).
      # Model di-download ulang tiap cold start (±30MB, beberapa detik).
      - key: MODEL_DIR
        value: saved_models
      - key: CHROMA_PATH
        value: ./chroma_db
      # URL model di Supabase Storage — isi nilainya di Render Dashboard (jangan commit)
      - key: URL_JOB_EXTRACTOR
        sync: false
      - key: URL_CAND_EXTRACTOR
        sync: false
      - key: URL_JOB_VEC
        sync: false
      - key: URL_RES_VEC
        sync: false
